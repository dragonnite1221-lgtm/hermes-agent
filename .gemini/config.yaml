# Gemini Code Assist: no automatic review on PR open.
# Reviews run only as a fallback when Codex hits its usage limit
# (see .github/workflows/gemini-fallback-review.yml), or manually via `/gemini review`.
have_fun: false
code_review:
  disable: false
  comment_severity_threshold: MEDIUM
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: false
    code_review: false
ignore_patterns: []
